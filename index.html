<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>나랑 듀오 할래?</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(145deg, #fce8f1, #eee8ff);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    color: #3d3740;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.card {
    width: calc(100% - 40px);
    max-width: 430px;
    max-height: 92vh;
    overflow-y: auto;
    background: rgba(255,255,255,.94);
    border-radius: 28px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(100,70,100,.15);
    position: relative;
}

.card::-webkit-scrollbar {
    display: none;
}

.game-icon {
    font-size: 43px;
    margin-bottom: 5px;
}

h1 {
    font-size: 22px;
    line-height: 1.45;
    margin: 8px 0 12px;
}

.description {
    color: #817983;
    line-height: 1.65;
    font-size: 13px;
    margin-bottom: 22px;
}

/* =========================
   버튼
========================= */

button {
    border: 0;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 15px;
    padding: 14px 18px;
    cursor: pointer;
}

.yes,
.no,
.submit,
.save-btn,
.again {
    width: 100%;
}

.button-row {
    display: flex;
    gap: 10px;
    width: 100%;
}

.button-row .yes,
.button-row .no {
    width: 50%;
    margin: 0;
}

.yes {
    background: #f28eae;
    color: white;
    box-shadow: 0 7px 18px rgba(242,142,174,.3);
}

.no {
    background: #f1eef1;
    color: #77717a;
}

#noButton {
    transition: left .15s ease, top .15s ease;
}

/* =========================
   날짜 / 시간
========================= */

.choice {
    margin: 16px 0;
    text-align: left;
}

.choice label {
    display: block;
    margin-bottom: 7px;
    font-weight: 600;
    font-size: 13px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #e4dce2;
    border-radius: 14px;
    font-size: 14px;
    font-family: inherit;
    background: white;
}

.small {
    font-size: 11px;
    color: #99919a;
    margin-top: 15px;
}

/* =========================
   중간 페이지
========================= */

.middle-button {
    background: #f28eae;
    color: white;
    box-shadow: 0 7px 18px rgba(242,142,174,.3);
    width: auto;
    min-width: 140px;
}

/* =========================
   떨어지는 이모지
========================= */

.falling {
    position: fixed;
    top: -40px;
    pointer-events: none;
    z-index: 20;
    animation: fall linear forwards;
    opacity: .75;
}

@keyframes fall {
    from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    90% {
        opacity: .65;
    }

    to {
        transform: translateY(110vh) rotate(25deg);
        opacity: 0;
    }
}

/* =========================
   스킨 선택
========================= */

.skin-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
    margin-top: 18px;
    margin-bottom: 18px;
}

.skin-button {
    background: #fff;
    color: #68616a;
    border: 1px solid #eadfe5;
    padding: 13px 8px;
    min-height: 48px;
    font-size: 12px;
    transition: .2s;
}

.skin-button:hover {
    border-color: #f28eae;
}

.skin-button.selected {
    background: #fff0f5;
    border: 2px solid #f28eae;
    color: #e2769b;
    box-shadow: 0 4px 12px rgba(242,142,174,.18);
}

.next-button {
    width: 100%;
    background: #f28eae;
    color: white;
    box-shadow: 0 7px 18px rgba(242,142,174,.3);
}

.selected-text {
    min-height: 20px;
    color: #e2769b;
    font-size: 12px;
    margin-bottom: 10px;
}

/* =========================
   마지막 페이지
========================= */

.final-card {
    background: rgba(255,255,255,.96);
    border: 1px solid #f3dce5;
}

.promise {
    background: #fff6f9;
    border: 1px solid #f4d5e1;
    border-radius: 18px;
    padding: 17px 15px;
    margin: 18px 0;
}

.promise-title {
    color: #e985a8;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
}

.date-line {
    font-size: 13px;
    color: #817983;
    line-height: 1.9;
}

.skin-result {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #f0dfe6;
    line-height: 1.8;
}

.skin-result strong {
    color: #e985a8;
}

.final-message {
    color: #817983;
    font-size: 13px;
    line-height: 1.8;
    margin: 18px 0;
}

.save-btn {
    background: #f28eae;
    color: white;
    box-shadow: 0 7px 18px rgba(242,142,174,.3);
}

.again {
    background: white;
    color: #c4869d;
    border: 1px solid #efc8d7;
    margin-top: 9px;
}
</style>
</head>

<body>

<div class="card" id="card">

    <div class="game-icon">🎮</div>

    <h1>
        혹시 나랑<br>
        발로란트 듀오 할래?
    </h1>

    <div class="description">
        나 요즘 같이 게임할 사람 찾고 있는데...<br>
        혹시 시간 괜찮으면 같이 한 판 해줄래?
    </div>

    <div class="button-row">

        <button class="yes" onclick="showMiddle()">
            좋아
        </button>

        <button class="no" id="noButton">
            싫어
        </button>

    </div>

</div>


<script>

/* =========================
   싫어 버튼 도망가기
========================= */

const noButton = document.getElementById("noButton");

function moveNoButton() {

    const maxX =
        Math.max(
            15,
            window.innerWidth -
            noButton.offsetWidth -
            30
        );

    const maxY =
        Math.max(
            15,
            window.innerHeight -
            noButton.offsetHeight -
            30
        );

    const x =
        Math.max(
            15,
            Math.random() * maxX
        );

    const y =
        Math.max(
            15,
            Math.random() * maxY
        );

    noButton.style.position = "fixed";
    noButton.style.left = x + "px";
    noButton.style.top = y + "px";
}

noButton.addEventListener(
    "mouseenter",
    moveNoButton
);

noButton.addEventListener(
    "touchstart",
    function(e) {
        e.preventDefault();
        moveNoButton();
    }
);


/* =========================
   중간 페이지
========================= */

function showMiddle() {

    document.getElementById("card").innerHTML = `

        <h1>
            잠시만.. 좋다고? 😭
        </h1>

        <div class="description">
            난 주완이가 거절할 줄 알았어...
        </div>

        <button
            class="middle-button"
            onclick="showDatePage()"
        >
            뭐라는 거야?
        </button>

    `;

    startFallingEmojis();
}


/* =========================
   떨어지는 이모지
========================= */

let emojiInterval;

function startFallingEmojis() {

    clearInterval(emojiInterval);

    const emojis = [
        "💕",
        "✨",
        "🎀",
        "💗",
        "🌸"
    ];

    let count = 0;

    emojiInterval = setInterval(function() {

        if (count >= 14) {
            clearInterval(emojiInterval);
            return;
        }

        const emoji =
            document.createElement("div");

        emoji.className = "falling";

        emoji.innerText =
            emojis[
                Math.floor(
                    Math.random() *
                    emojis.length
                )
            ];

        emoji.style.left =
            (5 + Math.random() * 90) + "vw";

        emoji.style.fontSize =
            (15 + Math.random() * 9) + "px";

        emoji.style.animationDuration =
            (3 + Math.random() * 2) + "s";

        document.body.appendChild(emoji);

        setTimeout(function() {
            emoji.remove();
        }, 6000);

        count++;

    }, 400);
}


/* =========================
   날짜 / 시간
========================= */

let selectedDate = "";
let selectedTime = "";
let selectedSheriff = "";
let selectedVandal = "";


function showDatePage() {

    clearInterval(emojiInterval);

    document
        .querySelectorAll(".falling")
        .forEach(e => e.remove());

    document.getElementById("card").innerHTML = `

        <div class="game-icon">
            🎮
        </div>

        <h1>
            그럼 언제가 편해?
        </h1>

        <div class="description">
            같이 할 날짜랑 시간을 골라줘!
        </div>

        <div class="choice">

            <label>
                📅 날짜
            </label>

            <input
                type="date"
                id="date"
                min="2026-08-28"
                max="2026-09-30"
            >

        </div>

        <div class="choice">

            <label>
                ⏰ 시간
            </label>

            <input
                type="time"
                id="time"
            >

        </div>

        <button
            class="submit yes"
            onclick="finishDate()"
        >
            이 시간으로 해줄게😏
        </button>

        <div class="small">
            2026년 9월 30일까지 선택할 수 있어!
        </div>

    `;
}


/* =========================
   날짜 제출
========================= */

function finishDate() {

    const date =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;

    if (!date || !time) {

        alert(
            "날짜랑 시간을 둘 다 골라줘! 🥺"
        );

        return;
    }

    selectedDate = date;
    selectedTime = time;

    showSheriff();
}


/* =========================
   셰리프 선택
========================= */

function showSheriff() {

    document.getElementById("card").innerHTML = `

        <div class="game-icon">
            🔫
        </div>

        <h1>
            어떤 셰리프 스킨을 착용할까 🤔
        </h1>

        <div class="description">
            같이 할 때 사용할 셰리프를 골라줘!
        </div>

        <div class="skin-grid">

            <button
                class="skin-button"
                onclick="selectSheriff(this, '네오 프런티어')"
            >
                네오 프런티어
            </button>

            <button
                class="skin-button"
                onclick="selectSheriff(this, '미스트블룸')"
            >
                미스트블룸
            </button>

        </div>

        <div class="selected-text" id="sheriffText">
            스킨을 하나 골라줘!
        </div>

        <button
            class="next-button"
            onclick="goToVandal()"
        >
            다음 →
        </button>

    `;
}


function selectSheriff(button, skin) {

    document
        .querySelectorAll(".skin-button")
        .forEach(btn =>
