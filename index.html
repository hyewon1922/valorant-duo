<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>발로란트 듀오</title>


<!-- ==================================================
     이미지 저장용 html2canvas
================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<style>

/* ==================================================
   기본
================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            145deg,
            #fce8f1,
            #eee8ff
        );

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

    color: #3d3740;

    overflow: hidden;
}


/* ==================================================
   카드
================================================== */

.card {
    width: calc(100% - 40px);
    max-width: 430px;

    max-height: 90vh;
    max-height: 90dvh;

    overflow-y: auto;

    background: rgba(255,255,255,.96);

    border-radius: 28px;

    padding: 30px 24px;

    text-align: center;

    box-shadow:
        0 15px 45px
        rgba(100,70,100,.15);

    position: relative;
    z-index: 2;
}

.card::-webkit-scrollbar {
    display: none;
}


/* ==================================================
   글씨
================================================== */

.icon {
    font-size: 42px;
    margin-bottom: 8px;
}

h1 {
    font-size: 22px;
    line-height: 1.45;
    margin: 8px 0 12px;
}

.desc {
    color: #817983;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 22px;
}


/* ==================================================
   버튼 공통
================================================== */

button {
    border: none;

    appearance: none;
    -webkit-appearance: none;

    font-family: inherit;
    font-size: 14px;
    font-weight: 600;

    border-radius: 15px;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;

    user-select: none;

    outline: none;
}


/* ==================================================
   첫 화면 버튼 영역
================================================== */

.button-row {
    display: flex;

    width: 100%;

    gap: 10px;

    justify-content: center;
    align-items: center;

    position: relative;

    min-height: 48px;
}


/* ==================================================
   좋아 / 싫어 버튼
================================================== */

.button-row .yes,
.button-row .no {

    width: 150px;
    min-width: 150px;
    max-width: 150px;

    height: 48px;
    min-height: 48px;
    max-height: 48px;

    padding: 0;

    flex: 0 0 150px;

    display: flex;

    justify-content: center;
    align-items: center;

    white-space: nowrap;

    border-radius: 15px;

    overflow: hidden;

    line-height: 48px;
}


/* ==================================================
   좋아
================================================== */

.yes {
    background: #f28eae;

    color: white;

    box-shadow:
        0 7px 18px
        rgba(242,142,174,.3);
}


/* ==================================================
   싫어
================================================== */

.no {

    background: #f1eef1;

    color: #77717a;

    position: relative;

    width: 150px !important;
    min-width: 150px !important;
    max-width: 150px !important;

    height: 48px !important;
    min-height: 48px !important;
    max-height: 48px !important;

    padding: 0 !important;

    flex: 0 0 150px !important;

    border: none !important;

    border-radius: 15px !important;

    box-shadow: none;

    display: flex !important;

    justify-content: center !important;
    align-items: center !important;

    white-space: nowrap;

    overflow: hidden;

    line-height: 48px;

    transform: none;

    transform-origin: center center;

    box-sizing: border-box !important;

    appearance: none !important;
    -webkit-appearance: none !important;
}


/* ==================================================
   싫어 버튼 이동
================================================== */

.no.moving {

    position: fixed !important;

    width: 150px !important;
    min-width: 150px !important;
    max-width: 150px !important;

    height: 48px !important;
    min-height: 48px !important;
    max-height: 48px !important;

    padding: 0 !important;

    border-radius: 15px !important;

    display: flex !important;

    justify-content: center !important;
    align-items: center !important;

    line-height: 48px;

    box-sizing: border-box !important;

    z-index: 9999;
}


/* ==================================================
   일반 다음 버튼
================================================== */

.next {
    width: 100%;

    min-height: 48px;

    background: #f28eae;

    color: white;

    margin-top: 8px;

    padding: 14px;

    border-radius: 15px;
}


/* ==================================================
   날짜 / 시간
================================================== */

.choice {
    text-align: left;

    margin: 16px 0;
}

.choice label {
    display: block;

    font-size: 13px;
    font-weight: 600;

    margin-bottom: 7px;
}

input {
    width: 100%;

    min-height: 48px;

    padding: 13px;

    border:
        1px solid #e4dce2;

    border-radius: 14px;

    font-family: inherit;
    font-size: 14px;

    background: white;

    appearance: none;
    -webkit-appearance: none;
}


/* ==================================================
   스킨
================================================== */

.skin-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;

    margin: 18px 0;
}

.skin {
    width: 100%;

    min-height: 48px;

    background: white;

    border:
        1px solid #eadfe5;

    color: #68616a;

    padding:
        11px 7px;

    font-size: 12px;

    transition:
        transform .15s ease;

    border-radius: 15px;
}

.skin:active {
    transform: scale(.98);
}

.skin.selected {
    background: #fff0f5;

    border:
        2px solid #f28eae;

    color: #e2769b;
}

.selected-text {
    min-height: 20px;

    font-size: 12px;

    color: #e2769b;

    margin-bottom: 8px;
}


/* ==================================================
   두 번째 페이지 이모티콘
================================================== */

.middle-icon {
    font-size: 42px;

    margin-bottom: 8px;
}


/* ==================================================
   떨어지는 이모지
================================================== */

.falling {
    position: fixed;

    top: -30px;

    z-index: 100;

    pointer-events: none;

    animation:
        fall linear forwards;
}

@keyframes fall {

    0% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    100% {
        transform:
            translateY(110vh)
            rotate(30deg);

        opacity: 0;
    }
}


/* ==================================================
   마지막 페이지
================================================== */

.promise {
    background: #fff6f9;

    border:
        1px solid #f4d5e1;

    border-radius: 18px;

    padding: 17px;

    margin: 18px 0;
}

.promise-title {
    color: #e985a8;

    font-size: 15px;
    font-weight: 700;

    margin-bottom: 10px;
}

.result {
    color: #817983;

    font-size: 13px;

    line-height: 2;
}

.final-message {
    color: #817983;

    font-size: 13px;

    line-height: 1.8;

    margin: 18px 0;
}

.save {
    width: 100%;

    min-height: 48px;

    background: #f28eae;

    color: white;

    padding: 14px;

    border-radius: 15px;
}

.edit {
    width: 100%;

    min-height: 48px;

    background: white;

    color: #c4869d;

    border:
        1px solid #efc8d7;

    margin-top: 9px;

    padding: 14px;

    border-radius: 15px;
}


/* ==================================================
   이미지 저장 중
================================================== */

.save.saving {
    opacity: .7;
    pointer-events: none;
}


/* ==================================================
   이미지로 만들 때 사용하는 카드
================================================== */

#card.capture-mode {

    overflow: visible;

}


/* ==================================================
   작은 화면
================================================== */

@media (max-width: 360px) {

    .card {
        width: calc(100% - 24px);

        padding:
            26px 18px;
    }

    .button-row {
        gap: 8px;
    }

    .button-row .yes,
    .button-row .no {

        width: 140px;
        min-width: 140px;
        max-width: 140px;

        flex: 0 0 140px;
    }

    .no.moving {

        width: 140px !important;
        min-width: 140px !important;
        max-width: 140px !important;
    }

    h1 {
        font-size: 20px;
    }
}

</style>
</head>


<body>

<div
    class="card"
    id="card">
</div>


<script>

/* ==================================================
   저장할 정보
================================================== */

let selectedDate = "";
let selectedTime = "";

let sheriff = "";
let vandal = "";


/* ==================================================
   1. 첫 화면
================================================== */

function showHome() {

    document.getElementById(
        "card"
    ).innerHTML = `

        <div class="icon">
            🎮
        </div>

        <h1>
            혹시 나랑<br>
            발로란트 듀오 할래?
        </h1>

        <div class="desc">
            나 요즘 같이 게임할 사람 찾고 있는데...<br>
            혹시 시간 괜찮으면 같이 해줄래?
        </div>

        <div class="button-row">

            <button
                type="button"
                class="yes"
                id="yesButton">

                좋아🥰

            </button>


            <button
                type="button"
                class="no"
                id="noButton">

                싫어🤪

            </button>

        </div>
    `;


    const yesButton =
        document.getElementById(
            "yesButton"
        );

    yesButton.addEventListener(
        "click",
        function() {

            showMiddle();

        }
    );


    const noButton =
        document.getElementById(
            "noButton"
        );


    noButton.addEventListener(
        "mouseenter",
        moveNoButton
    );


    noButton.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            moveNoButton();

        },
        {
            passive: false
        }
    );
}


/* ==================================================
   싫어 버튼 도망
================================================== */

function moveNoButton() {

    const button =
        document.getElementById(
            "noButton"
        );

    if (!button) {
        return;
    }


    const isSmall =
        window.innerWidth <= 360;

    const buttonWidth =
        isSmall ? 140 : 150;

    const buttonHeight = 48;


    button.classList.add(
        "moving"
    );


    button.style.position =
        "fixed";

    button.style.width =
        buttonWidth + "px";

    button.style.minWidth =
        buttonWidth + "px";

    button.style.maxWidth =
        buttonWidth + "px";

    button.style.height =
        buttonHeight + "px";

    button.style.minHeight =
        buttonHeight + "px";

    button.style.maxHeight =
        buttonHeight + "px";

    button.style.padding =
        "0";

    button.style.flex =
        "0 0 " +
        buttonWidth +
        "px";

    button.style.borderRadius =
        "15px";

    button.style.boxSizing =
        "border-box";

    button.style.display =
        "flex";

    button.style.justifyContent =
        "center";

    button.style.alignItems =
        "center";

    button.style.whiteSpace =
        "nowrap";

    button.style.overflow =
        "hidden";

    button.style.lineHeight =
        "48px";

    button.style.zIndex =
        "9999";


    const margin = 15;


    const maxX =
        Math.max(
            margin,
            window.innerWidth -
            buttonWidth -
            margin
        );


    const maxY =
        Math.max(
            margin,
            window.innerHeight -
            buttonHeight -
            margin
        );


    const x =
        margin +
        Math.random() *
        Math.max(
            0,
            maxX - margin
        );


    const y =
        margin +
        Math.random() *
        Math.max(
            0,
            maxY - margin
        );


    button.style.left =
        x + "px";

    button.style.top =
        y + "px";
}


/* ==================================================
   2. 두 번째 페이지
================================================== */

function showMiddle() {

    clearFallingEmojis();


    document.getElementById(
        "card"
    ).innerHTML = `

        <div class="middle-icon">
            🥹
        </div>

        <h1>
            잠시만.. 좋다고?
        </h1>

        <div class="desc">
            난 주완이가 거절할 줄 알았어...
        </div>

        <button
            type="button"
            class="next"
            id="middleButton">

            알겠어, 해줄게!

        </button>
    `;


    document.getElementById(
        "middleButton"
    ).addEventListener(
        "click",
        showDate
    );


    startFallingEmojis();
}


/* ==================================================
   떨어지는 이모지
================================================== */

function startFallingEmojis() {

    const emojis = [
        "💕",
        "✨️",
        "🎀",
        "💗",
        "🌸"
    ];


    for (
        let i = 0;
        i < 15;
        i++
    ) {

        setTimeout(
            function() {

                const emoji =
                    document.createElement(
                        "div"
                    );

                emoji.className =
                    "falling";


                emoji.innerText =
                    emojis[
                        Math.floor(
                            Math.random() *
                            emojis.length
                        )
                    ];


                emoji.style.left =
                    Math.random() *
                    95 +
                    "vw";


                emoji.style.fontSize =
                    15 +
                    Math.random() *
                    10 +
                    "px";


                emoji.style.animationDuration =
                    3 +
                    Math.random() *
                    2 +
                    "s";


                document.body.appendChild(
                    emoji
                );


                setTimeout(
                    function() {

                        emoji.remove();

                    },
                    6000
                );

            },
            i * 300
        );
    }
}


/* ==================================================
   이모지 제거
================================================== */

function clearFallingEmojis() {

    document
        .querySelectorAll(
            ".falling"
        )
        .forEach(
            function(element) {

                element.remove();

            }
        );
}


/* ==================================================
   3. 날짜 / 시간
================================================== */

function showDate() {

    clearFallingEmojis();


    document.getElementById(
        "card"
    ).innerHTML = `

        <h1>
            그럼 언제가 편해?
        </h1>

        <div class="desc">
            같이 할 날짜랑 시간을 골라줘!
        </div>


        <div class="choice">

            <label>
                📅 날짜
            </label>

            <input
                type="date"
                id="date"
                min="2026-08-28"
                max="2026-09-30"
            >

        </div>


        <div class="choice">

            <label>
                ⏰ 시간
            </label>

            <input
                type="time"
                id="time"
            >

        </div>


        <button
            type="button"
            class="next"
            id="dateButton">

            이 시간으로 해줄게😏

        </button>


        <div
            style="
                font-size:11px;
                color:#99919a;
                margin-top:14px;
            ">

            2026년 9월까지 선택할 수 있어!

        </div>
    `;


    document.getElementById(
        "dateButton"
    ).addEventListener(
        "click",
        saveDate
    );
}


/* ==================================================
   날짜 / 시간 저장
================================================== */

function saveDate() {

    const date =
        document.getElementById(
            "date"
        ).value;


    const time =
        document.getElementById(
            "time"
        ).value;


    if (!date || !time) {

        alert(
            "날짜랑 시간을 둘 다 골라줘! 🥺"
        );

        return;
    }


    selectedDate = date;

    selectedTime = time;


    showSheriff();
}


/* ==================================================
   4. 셰리프
================================================== */

function showSheriff() {

    document.getElementById(
        "card"
    ).innerHTML = `

        <h1>
            어떤 셰리프 스킨을 착용할까 🤔
        </h1>

        <div class="desc">
            같이 할 때 사용할 셰리프를 골라줘!
        </div>


        <div class="skin-grid">

            <button
                type="button"
                class="skin"
                onclick="
                    pickSheriff(
                        this,
                        '네오 프런티어'
                    )
                ">

                네오 프런티어

            </button>


            <button
                type="button"
                class="skin"
                onclick="
                    pickSheriff(
                        this,
                        '미스트블룸'
                    )
                ">

                미스트블룸

            </button>

        </div>


        <div
            class="selected-text"
            id="selectedSheriff">

            스킨을 하나 골라줘!

        </div>


        <button
            type="button"
            class="next"
            onclick="goVandal()">

            다음 →

        </button>
    `;
}


/* ==================================================
   셰리프 선택
================================================== */

function pickSheriff(
    button,
    value
) {

    document
        .querySelectorAll(
            ".skin"
        )
        .forEach(
            function(item) {

                item.classList.remove(
                    "selected"
                );

            }
        );


    button.classList.add(
        "selected"
    );


    sheriff = value;


    document.getElementById(
        "selectedSheriff"
    ).innerText =
        "선택한 셰리프 · " +
        value;
}


function goVandal() {

    if (!sheriff) {

        alert(
            "셰리프 스킨을 하나 골라줘! 🤔"
        );

        return;
    }


    showVandal();
}


/* ==================================================
   5. 밴달
================================================== */

function showVandal() {

    document.getElementById(
        "card"
    ).innerHTML = `

        <h1>
            어떤 밴달 스킨을 착용할까 😇
        </h1>

        <div class="desc">
            이번엔 밴달을 골라줘!
        </div>


        <div class="skin-grid">

            <button
                type="button"
                class="skin"
                onclick="
                    pickVandal(
                        this,
                        '크라이오스테이시스'
                    )
                ">

                크라이오스테이시스

            </button>


            <button
                type="button"
                class="skin"
                onclick="
                    pickVandal(
                        this,
                        '미스트블룸'
                    )
                ">

                미스트블룸

            </button>


            <button
                type="button"
                class="skin"
                onclick="
                    pickVandal(
                        this,
                        '제로팽'
                    )
                ">

                제로팽

            </button>


            <button
                type="button"
                class="skin"
                onclick="
                    pickVandal(
                        this,
                        '2024 챔피언스'
                    )
                ">

                2024 챔피언스

            </button>


            <button
                type="button"
                class="skin"
                onclick="
                    pickVandal(
                        this,
                        '에리스'
                    )
                ">

                에리스

            </button>


            <button
                type="button"
                class="skin"
                onclick="
                    pickVandal(
                        this,
                        '임페리움'
                    )
                ">

                임페리움

            </button>


            <button
                type="button"
                class="skin"
                onclick="
                    pickVandal(
                        this,
                        '오라바이 원탭'
                    )
                ">

                오라바이 원탭

            </button>


            <button
                type="button"
                class="skin"
                onclick="
                    pickVandal(
                        this,
                        '크로노보이드'
                    )
                ">

                크로노보이드

            </button>


            <button
                type="button"
                class="skin"
                onclick="
                    pickVandal(
                        this,
                        '싱귤레러티'
                    )
                ">

                싱귤레러티

            </button>


            <button
                type="button"
                class="skin"
                onclick="
                    pickVandal(
                        this,
                        '에보리'
                    )
                ">

                에보리

            </button>

        </div>


        <div
            class="selected-text"
            id="selectedVandal">

            스킨을 하나 골라줘!

        </div>


        <button
            type="button"
            class="next"
            onclick="finish()">

            이걸로 할게 ✨️

        </button>
    `;
}


/* ==================================================
   밴달 선택
================================================== */

function pickVandal(
    button,
    value
) {

    document
        .querySelectorAll(
            ".skin"
        )
        .forEach(
            function(item) {

                item.classList.remove(
                    "selected"
                );

            }
        );


    button.classList.add(
        "selected"
    );


    vandal = value;


    document.getElementById(
        "selectedVandal"
    ).innerText =
        "선택한 밴달 · " +
        value;
}


/* ==================================================
   오전 / 오후 변환
================================================== */

function formatTime(time) {

    const parts =
        time.split(":");


    let hour =
        Number(parts[0]);


    const minute =
        parts[1];


    const period =
        hour < 12
            ? "오전"
            : "오후";


    if (hour === 0) {

        hour = 12;

    }

    else if (hour > 12) {

        hour -= 12;

    }


    return (
        period +
        " " +
        hour +
        ":" +
        minute
    );
}


/* ==================================================
   6. 마지막 페이지
================================================== */

function finish() {

    if (!vandal) {

        alert(
            "밴달 스킨을 하나 골라줘! 😇"
        );

        return;
    }


    const date =
        new Date(
            selectedDate +
            "T00:00:00"
        );


    const dateText =
        date.getFullYear() +
        "년 " +
        (date.getMonth() + 1) +
        "월 " +
        date.getDate() +
        "일";


    const timeText =
        formatTime(
            selectedTime
        );


    document.getElementById(
        "card"
    ).innerHTML = `

        <h1>
            그날 발로란트에서<br>
            꼭 만나기로 약속 🎮❤️
        </h1>


        <div class="promise">

            <div class="promise-title">
                우리의 듀오 약속 💌
            </div>


            <div class="result">

                📅 ${dateText}<br>

                ⏰ ${timeText}<br>

                ✨️ 셰리프 · ${sheriff}<br>

                ✨️ 밴달 · ${vandal}

            </div>

        </div>


        <div class="final-message">

            캐리는 못하지만 트레이드 내줄게

        </div>


        <button
            type="button"
            class="save"
            id="saveButton"
            onclick="saveImage()">

            📸 사진으로 저장하기

        </button>


        <button
            type="button"
            class="edit"
            onclick="showDate()">

            시간 약속 수정하기

        </button>
    `;
}


/* ==================================================
   ★ 사진 저장
================================================== */

async function saveImage() {

    const card =
        document.getElementById("card");

    const saveButton =
        document.getElementById("saveButton");


    if (!card) {
        return;
    }


    /* 저장 중 표시 */

    if (saveButton) {

        saveButton.classList.add(
            "saving"
        );

        saveButton.innerText =
            "📸 사진 만드는 중...";
    }


    try {

        /*
           이미지에 버튼까지 들어가면
           이상하므로 저장할 때만
           버튼을 잠시 숨김
        */

        const buttons =
            card.querySelectorAll(
                ".save, .edit"
            );


        buttons.forEach(
            function(button) {

                button.style.display =
                    "none";

            }
        );


        /*
           캡처 모드
        */

        card.classList.add(
            "capture-mode"
        );


        /*
           html2canvas로 카드 전체를
           PNG 이미지로 변환
        */

        const canvas =
            await html2canvas(
                card,
                {
                    backgroundColor:
                        "#ffffff",

                    scale:
                        Math.min(
                            window.devicePixelRatio || 2,
                            3
                        ),

                    useCORS:
                        true,

                    allowTaint:
                        false,

                    logging:
                        false,

                    imageTimeout:
                        10000
                }
            );


        /*
           다시 버튼 표시
        */

        buttons.forEach(
            function(button) {

                button.style.display =
                    "";

            }
        );


        card.classList.remove(
            "capture-mode"
        );


        /*
           Canvas → PNG Blob
        */

        const blob =
            await new Promise(
                function(resolve) {

                    canvas.toBlob(
                        resolve,
                        "image/png",
                        1.0
                    );

                }
            );


        if (!blob) {

            throw new Error(
                "이미지 생성 실패"
            );

        }


        /*
           파일 이름
        */

        const fileName =
            "발로란트_듀오_약속.png";


        /*
           모바일에서 공유 메뉴를
           사용할 수 있으면 우선 사용
        */

        const file =
            new File(
                [blob],
                fileName,
                {
                    type:
                        "image/png"
                }
            );


        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files: [file]
            })
        ) {

            await navigator.share({

                files: [file],

                title:
                    "발로란트 듀오 약속",

                text:
                    "우리의 발로란트 듀오 약속 🎮❤️"

            });

        }

        else {

            /*
               공유 기능을 지원하지 않는
               브라우저에서는 직접 다운로드
            */

            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href = url;

            link.download =
                fileName;

            link.style.display =
                "none";


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            setTimeout(
                function() {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            alert(
                "사진이 PNG 파일로 저장되었어! 📸"
            );
        }


    }

    catch (error) {

        console.error(
            "이미지 저장 오류:",
            error
        );


        /*
           사용자가 공유창을
           그냥 닫은 경우에는
           오류 메시지를 띄우지 않음
        */

        if (
            error.name !==
            "AbortError"
        ) {

            alert(
                "사진 저장에 실패했어 🥺\n" +
                "인터넷 연결을 확인하고 다시 눌러줘!"
            );

        }

    }


    finally {

        /*
           혹시 오류가 나도
           화면 원상복구
        */

        const buttons =
            card.querySelectorAll(
                ".save, .edit"
            );


        buttons.forEach(
            function(button) {

                button.style.display =
                    "";

            }
        );


        card.classList.remove(
            "capture-mode"
        );


        if (saveButton) {

            saveButton.classList.remove(
                "saving"
            );

            saveButton.innerText =
                "📸 사진으로 저장하기";
        }
    }
}


/* ==================================================
   시작
================================================== */

showHome();

</script>
