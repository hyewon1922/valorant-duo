<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>발로란트 듀오</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(145deg, #fce8f1, #eee8ff);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    color: #3d3740;
    overflow: hidden;
}

.card {
    width: calc(100% - 40px);
    max-width: 430px;
    max-height: 90vh;
    overflow-y: auto;
    background: rgba(255,255,255,.96);
    border-radius: 28px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 15px 45px rgba(100,70,100,.15);
}

.card::-webkit-scrollbar {
    display: none;
}

.icon {
    font-size: 42px;
    margin-bottom: 8px;
}

h1 {
    font-size: 22px;
    line-height: 1.45;
    margin: 8px 0 12px;
}

.desc {
    color: #817983;
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 22px;
}


/* =========================
   기본 버튼
========================= */

button {
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 15px;
    padding: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.button-row {
    display: flex;
    gap: 10px;
    width: 100%;
}

.button-row button {
    width: 50%;
}

.yes {
    background: #f28eae;
    color: white;
    box-shadow: 0 7px 18px rgba(242,142,174,.3);
}

.no {
    background: #f1eef1;
    color: #77717a;
}

.next {
    width: 100%;
    background: #f28eae;
    color: white;
    margin-top: 8px;
}


/* =========================
   날짜 / 시간
========================= */

.choice {
    text-align: left;
    margin: 16px 0;
}

.choice label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #e4dce2;
    border-radius: 14px;
    font-family: inherit;
    font-size: 14px;
    background: white;
}


/* =========================
   스킨 선택
========================= */

.skin-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
    margin: 18px 0;
}

.skin {
    background: white;
    border: 1px solid #eadfe5;
    color: #68616a;
    min-height: 48px;
    padding: 11px 7px;
    font-size: 12px;
}

.skin.selected {
    background: #fff0f5;
    border: 2px solid #f28eae;
    color: #e2769b;
}

.selected-text {
    min-height: 20px;
    font-size: 12px;
    color: #e2769b;
    margin-bottom: 8px;
}


/* =========================
   떨어지는 이모지
========================= */

.falling {
    position: fixed;
    top: -30px;
    z-index: 100;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    100% {
        transform: translateY(110vh) rotate(30deg);
        opacity: 0;
    }
}


/* =========================
   마지막 페이지
========================= */

.promise {
    background: #fff6f9;
    border: 1px solid #f4d5e1;
    border-radius: 18px;
    padding: 17px;
    margin: 18px 0;
}

.promise-title {
    color: #e985a8;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 10px;
}

.result {
    color: #817983;
    font-size: 13px;
    line-height: 2;
}

.final-message {
    color: #817983;
    font-size: 13px;
    line-height: 1.8;
    margin: 18px 0;
}

.save {
    width: 100%;
    background: #f28eae;
    color: white;
}

.edit {
    width: 100%;
    background: white;
    color: #c4869d;
    border: 1px solid #efc8d7;
    margin-top: 9px;
}
</style>
</head>


<body>

<div class="card" id="card"></div>


<script>

/* ==================================================
   저장할 정보
================================================== */

let selectedDate = "";
let selectedTime = "";
let sheriff = "";
let vandal = "";


/* ==================================================
   1. 첫 화면
================================================== */

function showHome() {

    document.getElementById("card").innerHTML = `

        <div class="icon">
            🎮
        </div>

        <h1>
            혹시 나랑<br>
            발로란트 듀오 할래?
        </h1>

        <div class="desc">
            나 요즘 같이 게임할 사람 찾고 있는데...<br>
            혹시 시간 괜찮으면 같이 한 판 해줄래?
        </div>

        <div class="button-row">

            <button
                type="button"
                class="yes"
                id="yesButton">
                좋아
            </button>

            <button
                type="button"
                class="no"
                id="noButton">
                싫어
            </button>

        </div>
    `;


    /* 좋아 버튼 */

    const yesButton =
        document.getElementById("yesButton");

    yesButton.addEventListener(
        "click",
        showMiddle
    );


    /* 싫어 버튼 */

    const noButton =
        document.getElementById("noButton");

    noButton.addEventListener(
        "mouseenter",
        moveNoButton
    );

    noButton.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            moveNoButton();

        },
        { passive: false }
    );
}


/* ==================================================
   싫어 버튼 도망
================================================== */

function moveNoButton() {

    const button =
        document.getElementById("noButton");

    if (!button) return;


    button.style.position = "fixed";


    const maxX =
        window.innerWidth -
        button.offsetWidth -
        20;

    const maxY =
        window.innerHeight -
        button.offsetHeight -
        20;


    const x =
        Math.max(
            10,
            Math.random() * maxX
        );

    const y =
        Math.max(
            10,
            Math.random() * maxY
        );


    button.style.left =
        x + "px";

    button.style.top =
        y + "px";
}


/* ==================================================
   2. 두 번째 페이지
================================================== */

function showMiddle() {

    document.getElementById("card").innerHTML = `

        <h1>
            잠시만.. 좋다고? 😭
        </h1>

        <div class="desc">
            난 주완이가 거절할 줄 알았어...
        </div>

        <button
            type="button"
            class="next"
            id="middleButton">
            뭐라는거야?
        </button>
    `;


    document
        .getElementById("middleButton")
        .addEventListener(
            "click",
            showDate
        );


    startFallingEmojis();
}


/* ==================================================
   떨어지는 이모지
================================================== */

function startFallingEmojis() {

    const emojis = [
        "💕",
        "✨",
        "🎀",
        "💗",
        "🌸"
    ];


    for (
        let i = 0;
        i < 15;
        i++
    ) {

        setTimeout(
            function() {

                const emoji =
                    document.createElement("div");

                emoji.className =
                    "falling";

                emoji.innerText =
                    emojis[
                        Math.floor(
                            Math.random() *
                            emojis.length
                        )
                    ];


                emoji.style.left =
                    Math.random() * 95 +
                    "vw";


                emoji.style.fontSize =
                    15 +
                    Math.random() * 10 +
                    "px";


                emoji.style.animationDuration =
                    3 +
                    Math.random() * 2 +
                    "s";


                document.body.appendChild(
                    emoji
                );


                setTimeout(
                    function() {
                        emoji.remove();
                    },
                    6000
                );

            },
            i * 300
        );
    }
}


/* ==================================================
   3. 날짜 / 시간
================================================== */

function showDate() {

    document
        .querySelectorAll(".falling")
        .forEach(
            function(element) {
                element.remove();
            }
        );


    document.getElementById("card").innerHTML = `

        <div class="icon">
            🎮
        </div>

        <h1>
            그럼 언제가 편해?
        </h1>

        <div class="desc">
            같이 할 날짜랑 시간을 골라줘!
        </div>


        <div class="choice">

            <label>
                📅 날짜
            </label>

            <input
                type="date"
                id="date"
                min="2026-08-28"
                max="2026-09-30"
            >

        </div>


        <div class="choice">

            <label>
                ⏰ 시간
            </label>

            <input
                type="time"
                id="time"
            >

        </div>


        <button
            type="button"
            class="next"
            id="dateButton">

            이 시간으로 해줄게😏

        </button>


        <div style="
            font-size:11px;
            color:#99919a;
            margin-top:14px;
        ">

            2026년 9월까지 선택할 수 있어!

        </div>
    `;


    document
        .getElementById("dateButton")
        .addEventListener(
            "click",
            saveDate
        );
}


/* ==================================================
   날짜 저장
================================================== */

function saveDate() {

    const date =
        document.getElementById("date").value;

    const time =
        document.getElementById("time").value;


    if (!date || !time) {

        alert(
            "날짜랑 시간을 둘 다 골라줘! 🥺"
        );

        return;
    }


    selectedDate = date;

    selectedTime = time;


    showSheriff();
}


/* ==================================================
   4. 셰리프
================================================== */

function showSheriff() {

    document.getElementById("card").innerHTML = `

        <div class="icon">
            🔫
        </div>

        <h1>
            어떤 셰리프 스킨을 착용할까 🤔
        </h1>

        <div class="desc">
            같이 할 때 사용할 셰리프를 골라줘!
        </div>


        <div class="skin-grid">

            <button
                type="button"
                class="skin"
                onclick="pickSheriff(this, '네오 프런티어')">

                네오 프런티어

            </button>


            <button
                type="button"
                class="skin"
                onclick="pickSheriff(this, '미스트블룸')">

                미스트블룸

            </button>

        </div>


        <div
            class="selected-text"
            id="selectedSheriff">

            스킨을 하나 골라줘!

        </div>


        <button
            type="button"
            class="next"
            onclick="goVandal()">

            다음 →

        </button>
    `;
}


function pickSheriff(
    button,
    value
) {

    document
        .querySelectorAll(".skin")
        .forEach(
            function(item) {
                item.classList.remove(
                    "selected"
                );
            }
        );


    button.classList.add(
        "selected"
    );


    sheriff = value;


    document.getElementById(
        "selectedSheriff"
    ).innerText =
        "선택한 셰리프 · " +
        value;
}


function goVandal() {

    if (!sheriff) {

        alert(
            "셰리프 스킨을 하나 골라줘! 🤔"
        );

        return;
    }


    showVandal();
}


/* ==================================================
   5. 밴달
================================================== */

function showVandal() {

    document.getElementById("card").innerHTML = `

        <div class="icon">
            🔫
        </div>

        <h1>
            어떤 밴달 스킨을 착용할까 😇
        </h1>

        <div class="desc">
            이번엔 밴달을 골라줘!
        </div>


        <div class="skin-grid">

            <button class="skin"
                onclick="pickVandal(this,'크라이오스테이시스')">
                크라이오스테이시스
            </button>

            <button class="skin"
                onclick="pickVandal(this,'미스트블룸')">
                미스트블룸
            </button>

            <button class="skin"
                onclick="pickVandal(this,'제로팽')">
                제로팽
            </button>

            <button class="skin"
                onclick="pickVandal(this,'2024 챔피언스')">
                2024 챔피언스
            </button>

            <button class="skin"
                onclick="pickVandal(this,'에리스')">
                에리스
            </button>

            <button class="skin"
                onclick="pickVandal(this,'임페리움')">
                임페리움
            </button>

            <button class="skin"
                onclick="pickVandal(this,'오라바이 원탭')">
                오라바이 원탭
            </button>

            <button class="skin"
                onclick="pickVandal(this,'크로노보이드')">
                크로노보이드
            </button>

            <button class="skin"
                onclick="pickVandal(this,'싱귤러러티')">
                싱귤러러티
            </button>

            <button class="skin"
                onclick="pickVandal(this,'에보리')">
                에보리
            </button>

        </div>


        <div
            class="selected-text"
            id="selectedVandal">

            스킨을 하나 골라줘!

        </div>


        <button
            type="button"
            class="next"
            onclick="finish()">

            이걸로 할게 🎮

        </button>
    `;
}


function pickVandal(
    button,
    value
) {

    document
        .querySelectorAll(".skin")
        .forEach(
            function(item) {
                item.classList.remove(
                    "selected"
                );
            }
        );


    button.classList.add(
        "selected"
    );


    vandal = value;


    document.getElementById(
        "selectedVandal"
    ).innerText =
        "선택한 밴달 · " +
        value;
}


/* ==================================================
   오전 / 오후 변환
================================================== */

function formatTime(time) {

    let parts =
        time.split(":");

    let hour =
        Number(parts[0]);

    let minute =
        parts[1];


    let period =
        hour < 12
        ? "오전"
        : "오후";


    if (hour === 0) {
        hour = 12;
    }

    else if (hour > 12) {
        hour -= 12;
    }


    return (
        period +
        " " +
        hour +
        ":" +
        minute
    );
}


/* ==================================================
   6. 마지막 페이지
================================================== */

function finish() {

    if (!vandal) {

        alert(
            "밴달 스킨을 하나 골라줘! 😇"
        );

        return;
    }


    const date =
        new Date(
            selectedDate +
            "T00:00:00"
        );


    const dateText =
        date.getFullYear() +
        "년 " +
        (date.getMonth() + 1) +
        "월 " +
        date.getDate() +
        "일";


    const timeText =
        formatTime(
            selectedTime
        );


    document.getElementById(
        "card"
    ).innerHTML = `

        <h1>
            그날 발로란트에서<br>
            꼭 만나기로 약속 🎮❤️
        </h1>


        <div class="promise">

            <div class="promise-title">
                우리의 듀오 약속 💌
            </div>


            <div class="result">

                📅 ${dateText}<br>

                ⏰ ${timeText}<br>

                🔫 셰리프 · ${sheriff}<br>

                🔫 밴달 · ${vandal}

            </div>

        </div>


        <div class="final-message">

            캐리는 못하지만 트레이드 내줄게<br>

            선택한 스킨 착용하고 기다리고 있을게 🎮

        </div>


        <button
            type="button"
            class="save"
            onclick="saveImage()">

            📸 사진으로 저장하기

        </button>


        <button
            type="button"
            class="edit"
            onclick="showDate()">

            시간 약속 수정하기

        </button>
    `;
}


/* ==================================================
   사진 저장
================================================== */

function saveImage() {

    alert(
        "휴대폰의 화면 캡처 기능으로 저장해줘! 📸"
    );
}


/* ==================================================
   시작
================================================== */

showHome();

</script>

</body>
</html>
